</style></head><body><nav class="toolbar" aria-label="Presentation controls"><span class="brand">MASQFIT / NASEM · NOV 17</span><div class="controls"><button id="prev" aria-label="Previous slide">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Next slide">→</button><button id="overview" aria-pressed="false">All slides</button><button id="print">Print / PDF</button></div></nav><main><!-- SLIDES --></main><script>
const observedToggle=document.getElementById('toggle-observed');
if(observedToggle)observedToggle.addEventListener('click',()=>{const expanded=observedToggle.getAttribute('aria-expanded')!=='true';document.querySelectorAll('.observed-result').forEach(row=>row.hidden=!expanded);observedToggle.setAttribute('aria-expanded',String(expanded));observedToggle.textContent=expanded?'Hide observed fit':'Show observed fit';});
const slides=[...document.querySelectorAll('.slide')];let current=0;
const prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter'),overview=document.getElementById('overview');
function show(index,update=true){current=Math.max(0,Math.min(slides.length-1,index));slides.forEach((s,i)=>{s.classList.toggle('active',i===current);});counter.textContent=`${current+1} / ${slides.length}`;prev.disabled=current===0;next.disabled=current===slides.length-1;if(update)history.replaceState(null,'',`#slide-${current+1}`);if(document.body.classList.contains('all'))slides[current].scrollIntoView({block:'start'});else window.scrollTo(0,0);}
function fromHash(){const match=location.hash.match(/^#slide-(\d+)$/);show(match?Number(match[1])-1:0,false);}
prev.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));
overview.addEventListener('click',()=>{const all=document.body.classList.toggle('all');overview.setAttribute('aria-pressed',String(all));overview.textContent=all?'Single slide':'All slides';show(current,false);});
document.getElementById('print').addEventListener('click',()=>window.print());
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT','BUTTON','A'].includes(document.activeElement.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1);}if(e.key==='Home'){e.preventDefault();show(0);}if(e.key==='End'){e.preventDefault();show(slides.length-1);}});
window.addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
